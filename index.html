<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oktinsfly — Корпоративный стиль путешествий</title>
    <style>
        :root {
            --brand-blue: #003580; /* Глубокий синий из вашего логотипа */
            --brand-orange: #f57c00; /* Акцентный оранжевый */
            --white: #ffffff;
            --gray: #f4f6f8;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: var(--gray);
        }

        /* Шапка сайта */
        header {
            background: white;
            padding: 10px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--brand-blue);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 60px; /* Размер под ваш круглый логотип */
            width: auto;
            margin-right: 15px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: bold;
            color: var(--brand-blue);
            text-transform: uppercase;
        }

        nav a {
            margin-left: 25px;
            text-decoration: none;
            color: var(--brand-blue);
            font-weight: 600;
            font-size: 14px;
        }

        /* Главный баннер */
        .hero {
            background: linear-gradient(rgba(0,53,128,0.7), rgba(0,53,128,0.7)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109c0f3?auto=format&fit=crop&w=1600');
            background-size: cover;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .search-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 20px;
        }

        .search-form input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 200px;
        }

        .btn-main {
            background: var(--brand-orange);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            background: #e65100;
        }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo-container">
        <img src="logo.png" alt="Oktinsfly Logo" class="logo-img">
        <div class="brand-name">Oktinsfly</div>
    </a>
    <nav>
        <a href="#">Авиабилеты</a>
        <a href="#">Отели</a>
        <a href="#">О компании</a>
        <a href="#" style="color: var(--brand-orange);">Личный кабинет</a>
    </nav>
</header>

<section class="hero">
    <h1>Путешествуйте по стандартам Oktinsfly</h1>
    <div class="search-form">
        <input type="text" placeholder="Город отправления">
        <input type="text" placeholder="Куда летим?">
        <button class="btn-main">Найти варианты</button>
    </div>
</section>

</body>
</html>
